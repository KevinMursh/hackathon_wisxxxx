訴願書流程.md

系統透明度

講稿：
考量：
1.它避開「AI 替政府做決定」的政治風險。AI 只給一個答案，評審（尤其法制局的人）第一個反應會是「那承辦人幹嘛」；AI 給選項＋各自的法律後果和風險，定位就變成輔助。這不是包裝，是採用與否的門檻。
2.1 打造數據飛輪 你點到的問題是對的：101 份決定書是「輸出」，答辯書和卷證才是「輸入」，而輸入是不公開的。
答辯書——不是「不開放」，是根本沒有公開的機制。訴願法第 58 條第 3、4 項規定，機關檢卷答辯是送給受理訴願機關，答辯書抄送訴願人一份。所以一份答辯書全世界只存在三個地方：機關自己存查、受理訴願機關的卷裡、訴願人手上那份。沒有任何條文要求它上網，也沒有哪個機關會主動公開。
卷宗——是明文限定對象。訴願法第 49 條（閱覽卷內文書）、第 75 條第 2 項（閱覽原處分之證據資料）都把權利限於「訴願人、參加人或訴願代理人」，而且要到受理訴願機關指定的日、時、處所去看。第三人不在名單上。
只有訴願決定書例外，各機關會上網建資料庫。所以你會覺得決定書到處都是、答辯書一份難求——這不是錯覺，是制度設計的結果。

2.2有一個情境案例是今天可能承辦人員已經把他的一些數據做了匯入,那他要重新的匯入一些新的資訊的時候, 那這種時候我們可以幫忙利用chatbot的方式去進行數據的更新,以提供最準確的資訊在我們的前端頁面上面。

3.承辦人對 AI 產出的任何一層不滿意時，都有一個正式、可多點、可附依據的「修正意見」入口；系統要自己判斷這個意見影響哪幾層、只重算那幾層，並逐項回覆採納與否。 另外，右下角的問答要從擺設變成真的能查法條、查決定書、查本案卷證的「有據才答」助手，且能把查到的東西一鍵轉成修正意見。

4.可迭代優化的步驟式架構流程 非黑盒
